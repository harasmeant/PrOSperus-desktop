name: Validate prototype
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  prototype:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: node --check prototype/obsidian/main.js
      - name: Install GIO bindings
        run: sudo apt-get update && sudo apt-get install -y python3-gi gir1.2-glib-2.0
      - name: Launcher unit tests
        run: /usr/bin/python3 -m unittest discover -s prototype/obsidian -p 'test_*.py' -v
