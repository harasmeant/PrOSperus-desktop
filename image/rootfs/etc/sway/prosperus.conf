# Sesión PrOSperus: el escritorio es la única ventana en mosaico (fondo) y las
# aplicaciones flotan encima, en Fibonacci o pantalla completa (window_manager.py).
set $mod Mod4

input type:keyboard xkb_layout es
input type:pointer accel_profile flat
# Panel táctil: tocar es hacer clic (dos toques rápidos = doble clic), dos dedos = clic derecho,
# tocar y arrastrar mueve, no se mueve el cursor mientras se escribe y la velocidad crece con
# el gesto (adaptive). Sway lo deja todo apagado por defecto.
input type:touchpad {
    tap enabled
    tap_button_map lrm
    drag enabled
    drag_lock disabled
    dwt enabled
    accel_profile adaptive
    pointer_accel 0.2
    middle_emulation enabled
}
# Cursor Breeze (el de KDE) en Sway y en las aplicaciones (XCURSOR_* en prosperus-session, GTK en /etc/gtk-*).
seat * xcursor_theme breeze_cursors 24
focus_follows_mouse no
default_border pixel 2
default_floating_border pixel 2
gaps inner 0
output * bg #1e221c solid_color
# Efectos de SwayFX: desenfoque detrás de las ventanas translúcidas (consola, notas),
# esquinas redondeadas y sombra. smart_corner_radius deja recto el escritorio (única en mosaico).
corner_radius 12
smart_corner_radius enable
blur enable
blur_passes 3
blur_radius 6
shadows enable
shadow_blur_radius 22
shadow_color #00000070
# Ventanas sin foco algo apagadas; el escritorio y la píldora nunca (reglas más abajo).
default_dim_inactive 0.18
dim_inactive_colors.unfocused #000000FF
# Pantalla de QEMU: misma resolución que las capturas de la demo (no afecta a monitores reales).
output Virtual-1 mode --custom 1360x850

# Las aplicaciones dibujan su propia barra de título (cerrar, maximizar) y se
# arrastran desde ella; Super+arrastrar también mueve y Super+clic derecho cambia el tamaño.
for_window [all] border csd
# Píldora de controles (minimizar, ampliar, cerrar) sobre la aplicación enfocada:
# flotante, visible en todos los espacios y sin robar el foco al aparecer.
for_window [app_id="org.prosperus.Handle"] floating enable, sticky enable, border none
# Sway impone 75×50 a las flotantes por defecto: la píldora mide menos.
floating_minimum_size 24 x 24
no_focus [app_id="org.prosperus.Handle"]
# La píldora es pequeña y sin fondo: sin sombra ni desenfoque detrás.
for_window [app_id="org.prosperus.Handle"] shadows disable, blur disable, dim_inactive 0.0
# El escritorio nunca lleva marco y no se puede cerrar con el atajo de ventana.
# Solo la ventana principal (por su título): sus diálogos (Buscar, Explorar, Atajos…) comparten
# app_id y, si no, Sway los pegaba al lado partiendo la pantalla en dos.
for_window [app_id="org.prosperus.Desktop" title="^PrOSperus desktop$"] border none, floating disable, dim_inactive 0.0
for_window [app_id="org.prosperus.Desktop" title="^(?!PrOSperus desktop$)"] floating enable, border none

# Super+Tab / Super+Mayús+Tab: Sway avisa a PrOSperus (evento «binding») aunque otra aplicación tenga el foco.
bindsym $mod+Tab nop prosperus-project next
bindsym $mod+Shift+Tab nop prosperus-project prev
bindsym $mod+Return exec /usr/bin/prosperus-terminal
# Por si la tecla Super del teclado no llega como Super (teclados programables).
bindsym Ctrl+Alt+t exec /usr/bin/prosperus-terminal
# Super sola abre o cierra Buscar. Con --release, Sway solo la lanza si no se pulsó
# otra tecla entre medias (Super+Intro, Super+D…), cosa que el escritorio no puede saber.
bindsym --release Super_L nop prosperus-search
bindsym --release Super_R nop prosperus-search
# Super+C: asistente Claude (Claude Code) en la carpeta de proyectos.
bindsym $mod+c exec /usr/bin/prosperus-claude
bindsym $mod+f fullscreen toggle
# Bloquear (fondo del proyecto desenfocado), capturas y portapapeles.
bindsym $mod+l exec /usr/bin/prosperus-bloquear
bindsym Print exec /usr/bin/prosperus-captura
bindsym Shift+Print exec /usr/bin/prosperus-captura zona
# Como Spectacle en Bazzite: zona y editor para anotar (flechas, recuadros, texto).
bindsym $mod+Shift+s exec /usr/bin/prosperus-captura editar
bindsym $mod+v exec /usr/bin/prosperus-portapapeles
# Ventanas, como en KDE/Windows: Alt+F4 o Super+Q cierra, Super+↓ o Super+M minimiza,
# Super+↑ amplía o restaura (igual que el botón de la píldora) y Super+F pantalla completa.
# El escritorio ignora la orden de cerrar (modo quiosco).
bindsym $mod+q kill
bindsym Alt+F4 kill
bindsym $mod+d exec /usr/bin/prosperus-windows show-desktop
bindsym $mod+m exec /usr/bin/prosperus-windows minimize
bindsym $mod+Down exec /usr/bin/prosperus-windows minimize
bindsym $mod+Up exec /usr/bin/prosperus-windows maximize
bindsym $mod+Escape [app_id="org.prosperus.Desktop"] focus
bindsym Alt+Tab focus next
bindsym Alt+Shift+Tab focus prev
floating_modifier $mod normal
# Varios monitores: Super+Mayús+flecha lleva la ventana a la pantalla de ese lado;
# Super+Ctrl+flecha mueve el foco entre pantallas.
bindsym $mod+Shift+Left move container to output left, focus output left
bindsym $mod+Shift+Right move container to output right, focus output right
bindsym $mod+Shift+Up move container to output up, focus output up
bindsym $mod+Shift+Down move container to output down, focus output down
bindsym $mod+Ctrl+Left focus output left
bindsym $mod+Ctrl+Right focus output right

# Disposición de monitores guardada en «Monitores» (por defecto, extender a la derecha).
exec env PYTHONPATH=/usr/lib/prosperus python3 -m prosperus.display_settings --apply
# Los portales (tema oscuro, compartir pantalla) se activan por D-Bus: necesitan saber la pantalla.
exec dbus-update-activation-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP SWAYSOCK XCURSOR_THEME XCURSOR_SIZE
exec /usr/bin/prosperus-handle
# Historial del portapapeles (texto e imágenes) para Super+V.
exec wl-paste --watch cliphist store
exec wl-paste --type image --watch cliphist store
# Sin usar el equipo: bloquea a los 10 min y apaga la pantalla a los 15; también al suspender.
exec swayidle -w timeout 600 /usr/bin/prosperus-bloquear \
    timeout 900 'swaymsg "output * power off"' resume 'swaymsg "output * power on"' \
    before-sleep /usr/bin/prosperus-bloquear
# Input Remapper: la primera vez se copian los preajustes de la imagen (botón lateral del
# Razer Naga como clic izquierdo) y se cargan los marcados para cargarse solos.
exec sh -c 'c=$HOME/.config/input-remapper-2; [ -e "$c" ] || { mkdir -p "$HOME/.config" && cp -r /usr/share/prosperus/input-remapper-2 "$c"; }; input-remapper-control --command autoload' 2>&1 | systemd-cat --identifier=prosperus-remapper
# Notificaciones: el escritorio reescribe esta copia con el tono del proyecto (makoctl reload).
exec sh -c 'd=$XDG_RUNTIME_DIR/prosperus; mkdir -p "$d"; cp -n /etc/prosperus/mako.conf "$d/mako.conf"; exec mako --config "$d/mako.conf"'
exec /usr/libexec/prosperus-client
# Diagnóstico en equipos reales: teclados, ratones y pantallas que ve Sway, en el registro.
exec sh -c 'sleep 8; swaymsg -t get_inputs; swaymsg -t get_outputs' 2>&1 | systemd-cat --identifier=prosperus-diag

# Teclas multimedia del portátil (también con la pantalla bloqueada).
bindsym --locked XF86AudioRaiseVolume exec /usr/bin/prosperus-osd subir
bindsym --locked XF86AudioLowerVolume exec /usr/bin/prosperus-osd bajar
bindsym --locked XF86AudioMute exec /usr/bin/prosperus-osd silenciar
bindsym --locked XF86AudioMicMute exec /usr/bin/prosperus-osd micro
bindsym --locked XF86MonBrightnessUp exec /usr/bin/prosperus-osd brillo-mas
bindsym --locked XF86MonBrightnessDown exec /usr/bin/prosperus-osd brillo-menos
bindsym --locked XF86AudioPlay exec playerctl play-pause
bindsym --locked XF86AudioPause exec playerctl pause
bindsym --locked XF86AudioNext exec playerctl next
bindsym --locked XF86AudioPrev exec playerctl previous
# Barra en pantalla (wob) para volumen y brillo, con los colores del proyecto. Si el escritorio
# cambia de tono, cierra wob y este bucle lo vuelve a abrir con la configuración nueva
# (la tubería queda abierta en el descriptor 3: no se pierde ningún valor entre medias).
exec sh -c 'd=$XDG_RUNTIME_DIR/prosperus; mkdir -p "$d"; f=$d/wob.fifo; rm -f "$f"; mkfifo "$f"; exec 3<>"$f"; while :; do if [ -r "$d/wob.ini" ]; then wob -c "$d/wob.ini" <&3; else wob <&3; fi; sleep 0.3; done'
# Diagnóstico de brillo y sonido en el registro del USB.
exec sh -c 'sleep 10; brightnessctl -l -c backlight; wpctl status' 2>&1 | systemd-cat --identifier=prosperus-diag
