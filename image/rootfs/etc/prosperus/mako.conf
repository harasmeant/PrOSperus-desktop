# Notificaciones a juego con el escritorio; el tono se oye si está instalado.
font=DejaVu Sans 11
background-color=#1d231cee
text-color=#e3e8da
border-color=#9fc28a
border-radius=12
border-size=1
padding=12
margin=14
default-timeout=6000
anchor=top-right
on-notify=exec sh -c 'f=/usr/share/sounds/KimPossible/stereo/kim-possible.wav; [ -f "$f" ] && pw-play "$f"'

[mode=do-not-disturb]
invisible=1
on-notify=none

# Número del volumen y el brillo (prosperus-osd), centrado justo encima de la barra de wob
# (margen 140 + alto 34): sin sonido, sin historial y visible también en «no molestar».
[app-name=prosperus-osd]
anchor=bottom-center
margin=0,0,182,0
padding=4,14
border-radius=10
font=DejaVu Sans Bold 13
text-alignment=center
default-timeout=1200
history=0
on-notify=none
invisible=0
