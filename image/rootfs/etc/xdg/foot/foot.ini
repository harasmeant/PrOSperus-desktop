# Consola a juego con el escritorio: translúcida, con barra de título del mismo tono.
# Los iconos (eza --icons) salen de los símbolos de Nerd Fonts, como fuente de respaldo.
font=DejaVu Sans Mono:size=11,Symbols Nerd Font Mono:size=11

[colors-dark]
# Fondo al 80 % (20 % de transparencia): se intuye el escritorio sin perder la lectura.
alpha=0.8
background=1d231c
foreground=dedace
# Paleta suave a juego con el escritorio (propuesta por qwen2.5-coder).
regular0=222623
regular1=cc7870
regular2=96ba8c
regular3=d6be82
regular4=7ea0c4
regular5=ba8cba
regular6=82b8b4
regular7=c8c6bc
bright0=7a8478
bright1=d27e7b
bright2=9cc092
bright3=dcc488
bright4=84a6ca
bright5=c092c0
bright6=88beba
bright7=ceccc8

[csd]
size=28
# Sway ignora minimizar y maximizar de las aplicaciones: los botones de Foot no harían nada.
# Se quitan y la píldora de PrOSperus (sobre la ventana enfocada) da cerrar, minimizar y ampliar.
button-width=0
double-click-to-maximize=no
color=cc2a3328
button-color=ffe3e8da
button-minimize-color=ff344030
button-maximize-color=ff344030
button-close-color=ffa04a3c
