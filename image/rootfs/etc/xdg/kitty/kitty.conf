# SPDX-License-Identifier: GPL-3.0-only
# Consola a juego con el escritorio. El escritorio publica una copia con el tono del
# proyecto ($XDG_RUNTIME_DIR/prosperus/kitty.conf) que incluye esta y cambia fondo y texto.
font_family DejaVu Sans Mono
font_size 11
# Iconos de eza (--icons): símbolos de Nerd Fonts como respaldo.
symbol_map U+E000-U+F8FF,U+F0000-U+FFFFF Symbols Nerd Font Mono
window_padding_width 6 10
cursor_shape beam
enable_audio_bell no
confirm_os_window_close 0
update_check_interval 0
wayland_titlebar_color background

background #1d231c
foreground #dedace
selection_background #344030
# Paleta suave a juego con el escritorio (la misma que los bloques de código de las notas).
color0  #222623
color1  #cc7870
color2  #96ba8c
color3  #d6be82
color4  #7ea0c4
color5  #ba8cba
color6  #82b8b4
color7  #c8c6bc
color8  #7a8478
color9  #d27e7b
color10 #9cc092
color11 #dcc488
color12 #84a6ca
color13 #c092c0
color14 #88beba
color15 #ceccc8
