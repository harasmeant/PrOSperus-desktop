# Controlador propietario de NVIDIA: Wayland (Sway) necesita el modo KMS del módulo
# (en la 550 viene apagado). Debian renombra los módulos (nvidia-current[-open]-drm)
# y las opciones van por nombre de archivo: sin esas líneas la NVIDIA sale sin
# salidas y Sway no arranca. Sin efecto mientras no esté instalado.
options nvidia-drm modeset=1 fbdev=1
options nvidia-current-drm modeset=1 fbdev=1
options nvidia-current-open-drm modeset=1 fbdev=1
